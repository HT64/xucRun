# Purpose: Structured German bug report form for xucRun that collects the environment and reproduction details needed for a single maintainer to investigate.
# Approach: Uses a GitHub issue form with required version and reproduction fields and routes suspected vulnerabilities to private reporting.
name: Fehlerbericht
description: Ein reproduzierbares Problem mit xucRun melden (Deutsch).
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Vielen Dank, dass Sie sich die Zeit für eine Fehlermeldung nehmen.

        **Melden Sie vermutete Sicherheitslücken nicht hier.** Verwenden Sie stattdessen den
        vertraulichen Weg aus [SECURITY.de.md](../blob/main/SECURITY.de.md) (GitHub Private
        Vulnerability Reporting).

        Bitte prüfen Sie zuerst die [README](../blob/main/README.de.md); viele Verhaltensweisen,
        insbesondere zu UAC, Kontowahl, Freigaben sowie den Modi `/system` und `/trustedinstaller`,
        sind dort beschrieben.
  - type: input
    id: xucrun-version
    attributes:
      label: xucRun-Version
      description: Ausgabe von `xucRun.exe /info` oder die Version in der Titelleiste eines Dialogs, zum Beispiel `0.9.1.7`.
      placeholder: "0.9.1.7"
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows-Version
      description: Edition und Build, zum Beispiel `Windows 11 Pro 24H2 (26100.2605)` oder `Windows 10 Pro 22H2 (19045.5131)`.
    validations:
      required: true
  - type: dropdown
    id: tray-installed
    attributes:
      label: xucRun Tray installiert?
      options:
        - "Nein"
        - "Ja, gleiche Version wie xucRun"
        - "Ja, andere Version"
    validations:
      required: true
  - type: dropdown
    id: account-scenario
    attributes:
      label: Kontoszenario
      description: Welche Kombination aus aufrufendem Konto und Zielkonto haben Sie verwendet?
      options:
        - "Standardkonto startet unter einem getrennten Administratorkonto"
        - "Administratorkonto startet unter demselben Konto (UAC)"
        - "Start unter einem anderen Standardkonto"
        - "/system oder /trustedinstaller"
        - "Sonstiges / nicht zutreffend"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Genaue Befehlszeile
      description: Der verwendete xucRun-Aufruf mit allen Schaltern. Kontonamen und Pfade dürfen durch Platzhalter ersetzt werden, die Struktur sollte erhalten bleiben. Niemals Kennwörter angeben.
      render: text
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Schritte zur Reproduktion
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Erwartetes Verhalten
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Tatsächliches Verhalten
      description: Bitte den genauen Text von Dialogen oder Konsolenmeldungen angeben. Screenshots sind willkommen; Kontonamen, die nicht veröffentlicht werden sollen, bitte unkenntlich machen.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Diagnose (optional)
      description: Relevante Zeilen aus dem Client-Log (`ClientLogDirectory` in `xucRun.ini`), die `xucRunBroker`-Einträge im Windows-Anwendungsereignisprotokoll oder die Ausgabe von `xucRun.exe /audit`. Entfernen Sie alles, was Sie als vertraulich ansehen.
      render: text
  - type: checkboxes
    id: confirmations
    attributes:
      label: Bestätigungen
      options:
        - label: Dieser Bericht beschreibt keine Sicherheitslücke.
          required: true
        - label: Ich habe Kennwörter und andere Geheimnisse aus dem Bericht entfernt.
          required: true
