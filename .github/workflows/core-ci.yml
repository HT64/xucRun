# Purpose: Builds and validates the public xucRun Core on a clean Windows runner.
name: Core CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    name: Build, test, and package (${{ matrix.configuration }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: Debug
            artifact-suffix: debug
          - configuration: Release
            artifact-suffix: release

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Build ${{ matrix.configuration }} x64
        shell: powershell
        run: |
          msbuild.exe .\XUCRun.sln `
            /t:Build `
            /p:Configuration=${{ matrix.configuration }} `
            /p:Platform=x64 `
            /m `
            /nologo `
            /verbosity:minimal
          if ($LASTEXITCODE -ne 0) {
              throw "MSBuild failed with exit code $LASTEXITCODE."
          }

      - name: Run Core tests
        shell: powershell
        run: |
          & .\xucRunCoreTests\x64\${{ matrix.configuration }}\xucRunCoreTests.exe
          if ($LASTEXITCODE -ne 0) {
              throw "Core tests failed with exit code $LASTEXITCODE."
          }

      - name: Verify client version
        shell: powershell
        run: |
          $version = (Get-Item -LiteralPath `
            '.\xucRun\x64\${{ matrix.configuration }}\xucRun.exe').
            VersionInfo.ProductVersion
          if ($version -ne '0.9.0.1') {
              throw "Expected xucRun.exe version 0.9.0.1, found '$version'."
          }
          $installer = Get-Item -LiteralPath `
              '.\xucRun\x64\${{ matrix.configuration }}\Installer.exe'
          if ($installer.VersionInfo.ProductVersion -ne '0.9.0.1') {
              throw "Installer.exe has unexpected version '$($installer.VersionInfo.ProductVersion)'."
          }
          if ($installer.VersionInfo.FileDescription -ne 'xucRun Core Installer') {
              throw "Installer.exe has unexpected description '$($installer.VersionInfo.FileDescription)'."
          }

      - name: Verify tracked files are unchanged
        shell: powershell
        run: |
          $changes = @(git status --porcelain=v1 --untracked-files=no)
          if ($changes.Count -ne 0) {
              throw "The build modified tracked files.`n$($changes -join "`n")"
          }

      - name: Create and verify unsigned package
        shell: powershell
        run: |
          $package = Join-Path $PWD `
            'artifacts\CorePackage\${{ matrix.configuration }}'
          powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File .\New-xucRun-CorePackage.ps1 `
            -Configuration ${{ matrix.configuration }} `
            -DestinationDirectory $package
          if ($LASTEXITCODE -ne 0) {
              throw "Package creation failed with exit code $LASTEXITCODE."
          }

          $actual = @(Get-ChildItem -LiteralPath $package -Recurse -File |
            ForEach-Object {
              $_.FullName.Substring($package.Length).TrimStart('\')
            } |
            Sort-Object)
          $installerName = 'xucRun-Core-Installer-0.9.0.1-x64.exe'
          $expected = @(
            'Install-xucRun-Core.ps1'
            $installerName
            'Languages\xucRun.de-DE.dll'
            'Languages\xucRun.en-US.dll'
            'SHA256SUMS.json'
            'UserCodeSigning\Sign-xucRunCorePackage.ps1'
            'xucRun.exe'
            'xucRunApproval.exe'
            'xucRunBroker.exe'
          ) | Sort-Object
          if (($actual -join "`n") -cne ($expected -join "`n")) {
              throw "Package contents differ from the exact Core package contract.`n" +
                ($actual -join "`n")
          }
          $publishedInstaller = Get-Item -LiteralPath (
            Join-Path $package $installerName)
          if ($publishedInstaller.VersionInfo.ProductVersion -ne '0.9.0.1') {
            throw "Published installer name and product version do not match."
          }

      - name: Create unsigned release assets
        if: matrix.configuration == 'Release'
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File .\New-xucRun-CoreRelease.ps1 `
            -ExpectedVersion 0.9.0.1
          if ($LASTEXITCODE -ne 0) {
            throw "Release packaging failed with exit code $LASTEXITCODE."
          }
          $releaseDirectory = '.\artifacts\Release\0.9.0.1'
          $expected = @(
            'SHA256SUMS.txt'
            'xucRun-Core-0.9.0.1-x64.zip'
            'xucRun-Core-Installer-0.9.0.1-x64.exe'
          ) | Sort-Object
          $actual = @(Get-ChildItem -LiteralPath $releaseDirectory -File |
            ForEach-Object Name |
            Sort-Object)
          if (($actual -join "`n") -cne ($expected -join "`n")) {
            throw "Release assets differ from the exact contract.`n" +
              ($actual -join "`n")
          }

      - name: Upload unsigned ${{ matrix.configuration }} package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xucRun-Core-0.9.0.1-unsigned-${{ matrix.artifact-suffix }}
          path: artifacts/CorePackage/${{ matrix.configuration }}
          if-no-files-found: error
          retention-days: 7

  installer-smoke-test:
    name: Install, update, and uninstall
    needs: build-test-package
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download unsigned Release package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: xucRun-Core-0.9.0.1-unsigned-release
          path: artifacts/CorePackage/Release

      - name: Run installer smoke test
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File .\Test-CoreInstaller.ps1 `
            -PackageDirectory .\artifacts\CorePackage\Release
          if ($LASTEXITCODE -ne 0) {
              throw "Installer smoke test failed with exit code $LASTEXITCODE."
          }
