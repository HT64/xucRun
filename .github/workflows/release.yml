# Purpose: Builds and attests unsigned xucRun release assets and stages unpublished releases as drafts.
name: xucRun Release

on:
  push:
    tags:
      - 'v*.*.*.*'

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: xucRun-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-draft-release:
    name: Build and stage release
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Validate release tag
        shell: powershell
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v(\d+\.\d+\.\d+\.\d+)$') {
            throw "Release tag has an invalid format: $env:GITHUB_REF_NAME"
          }
          $version = $Matches[1]
          git fetch origin main --no-tags
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw 'The release tag does not point to a commit on origin/main.'
          }
          "XUCRUN_RELEASE_VERSION=$version" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Build Release x64
        shell: powershell
        run: |
          msbuild.exe .\XUCRun.sln `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /m `
            /nologo `
            /verbosity:minimal
          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed with exit code $LASTEXITCODE."
          }

      - name: Run tests
        shell: powershell
        run: |
          & .\xucRunCoreTests\x64\Release\xucRunCoreTests.exe
          if ($LASTEXITCODE -ne 0) {
            throw "Tests failed with exit code $LASTEXITCODE."
          }

      - name: Create unsigned release assets
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File .\New-xucRun-Release.ps1 `
            -ExpectedVersion $env:XUCRUN_RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) {
            throw "Release packaging failed with exit code $LASTEXITCODE."
          }

      - name: Verify tracked files are unchanged
        shell: powershell
        run: |
          $changes = @(git status --porcelain=v1 --untracked-files=no)
          if ($changes.Count -ne 0) {
            throw "The release build modified tracked files.`n$($changes -join "`n")"
          }

      - name: Attest release assets
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            artifacts/Release/${{ env.XUCRUN_RELEASE_VERSION }}/*.exe
            artifacts/Release/${{ env.XUCRUN_RELEASE_VERSION }}/*.zip
            artifacts/Release/${{ env.XUCRUN_RELEASE_VERSION }}/SHA256SUMS.txt

      - name: Upload release preparation artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xucRun-${{ env.XUCRUN_RELEASE_VERSION }}-release-assets
          path: artifacts/Release/${{ env.XUCRUN_RELEASE_VERSION }}
          if-no-files-found: error
          retention-days: 30

      - name: Create or update draft GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:XUCRUN_RELEASE_VERSION
          $tag = $env:GITHUB_REF_NAME
          $releaseDirectory = Join-Path $PWD "artifacts\Release\$version"
          $installerName = "xucRun-Installer-$version-x64.exe"
          $archiveName = "xucRun-$version-x64.zip"
          $notesPath = Join-Path $releaseDirectory 'RELEASE-NOTES.md'
          powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File .\New-xucRun-ReleaseNotes.ps1 `
            -Version $version `
            -ChecksumPath (Join-Path $releaseDirectory 'SHA256SUMS.txt') `
            -DestinationPath $notesPath
          if ($LASTEXITCODE -ne 0) {
            throw "Creating release notes failed with exit code $LASTEXITCODE."
          }

          $existingReleases = @(
            gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" |
              ConvertFrom-Json |
              Where-Object { $_.tag_name -eq $tag }
          )
          if ($existingReleases.Count -gt 1) {
            throw "Multiple GitHub Releases exist for tag '$tag'."
          }
          if ($existingReleases.Count -eq 1 -and -not $existingReleases[0].draft) {
            Write-Host "::notice title=Published release retained::A published GitHub Release already exists for tag '$tag'. The tagged source was built and its assets remain available only as the workflow artifact. Published assets and attestations were not replaced and may refer to an earlier commit."
            @"
          ### Published release retained

          The tagged source was built and validated. A published release already exists for tag
          $tag, so its assets, release notes, and attestations were not modified. They may
          refer to an earlier commit than the current tag. The newly built files are available
          only in the workflow artifact.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            exit 0
          }
          if ($existingReleases.Count -eq 1) {
            gh release edit $tag `
              --title "xucRun $version" `
              --notes-file $notesPath `
              --draft
            if ($LASTEXITCODE -ne 0) {
              throw "Updating the draft GitHub Release failed with exit code $LASTEXITCODE."
            }
            gh release upload $tag `
              (Join-Path $releaseDirectory $installerName) `
              (Join-Path $releaseDirectory $archiveName) `
              (Join-Path $releaseDirectory 'SHA256SUMS.txt') `
              --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "Updating draft release assets failed with exit code $LASTEXITCODE."
            }
            exit 0
          }
          gh release create $tag `
            (Join-Path $releaseDirectory $installerName) `
            (Join-Path $releaseDirectory $archiveName) `
            (Join-Path $releaseDirectory 'SHA256SUMS.txt') `
            --draft `
            --verify-tag `
            --title "xucRun $version" `
            --notes-file $notesPath
          if ($LASTEXITCODE -ne 0) {
            throw "Creating the draft GitHub Release failed with exit code $LASTEXITCODE."
          }
