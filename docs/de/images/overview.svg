<?xml version="1.0" encoding="UTF-8"?>
<!--
Purpose: Illustrates the xucRun overview in German: one Windows session, a separate target-account identity for the launched program.
Approach: Uses a self-contained SVG with system fonts, a fixed light background, and no external resources.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 508" width="960" height="508" role="img" aria-labelledby="title desc" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" fill="#1f2328">
  <title id="title">xucRun im Überblick: eine Windows-Sitzung, zwei Identitäten</title>
  <desc id="desc">Der angemeldete Standardbenutzer ruft xucRun in seiner Windows-Sitzung auf, wählt ein Zielkonto und entscheidet über die Erhöhung. Der privilegierte xucRun-Brokerdienst verwendet gespeicherte Anmeldedaten nur mit passender Freigabe und startet das Programm unter dem Zielkonto. Die Rechte des Standardbenutzers bleiben unverändert.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="507" rx="12" fill="#ffffff" stroke="#d0d7de"/>

  <rect x="20" y="20" width="920" height="292" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <g transform="translate(40 33)" fill="none" stroke="#57606a" stroke-width="1.6" stroke-linecap="round">
    <rect x="0" y="0" width="20" height="14" rx="2"/>
    <path d="M6 18 H14 M10 14 V18"/>
  </g>
  <text x="70" y="46" font-size="15" font-weight="600">Windows-Sitzung des angemeldeten Standardbenutzers</text>

  <rect x="40" y="68" width="230" height="184" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <g transform="translate(234 82)" fill="#0969da">
    <circle cx="10" cy="7" r="6"/>
    <path d="M-1 27 C-1 19 4 16 10 16 C16 16 21 19 21 27 Z"/>
  </g>
  <text x="56" y="92" font-size="11" font-weight="700" letter-spacing="0.8" fill="#0550ae">ANMELDEKONTO</text>
  <text x="56" y="120" font-size="17" font-weight="600">Eigene Programme</text>
  <text x="56" y="148" font-size="13.5">Identität: Standardkonto</text>
  <text x="56" y="168" font-size="13.5">Rechte bleiben unverändert</text>
  <g fill="#ffffff" stroke="#0969da" stroke-width="1.2">
    <rect x="56" y="194" width="52" height="38" rx="4"/>
    <rect x="118" y="194" width="52" height="38" rx="4"/>
    <rect x="180" y="194" width="52" height="38" rx="4"/>
    <path d="M56 204 H108 M118 204 H170 M180 204 H232" fill="none"/>
  </g>

  <rect x="325" y="68" width="245" height="184" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
  <text x="341" y="92" font-size="11" font-weight="700" letter-spacing="0.8" fill="#57606a">AUFRUF</text>
  <text x="341" y="120" font-size="15" font-weight="700" font-family="Consolas, 'Cascadia Mono', Menlo, monospace">xucRun &lt;Programm&gt;</text>
  <circle cx="352" cy="151" r="10"/>
  <text x="352" y="155.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="370" y="156" font-size="13.5">Zielkonto wählen</text>
  <circle cx="352" cy="185" r="10"/>
  <text x="352" y="189.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="370" y="190" font-size="13.5">Erhöht starten?</text>
  <text x="370" y="211" font-size="12" fill="#57606a">nur mit einem Zielkonto aus</text>
  <text x="370" y="227" font-size="12" fill="#57606a">der Administratorengruppe</text>

  <rect x="625" y="68" width="295" height="184" rx="8" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/>
  <g transform="translate(884 82)" fill="#bf8700">
    <circle cx="10" cy="7" r="6"/>
    <path d="M-1 27 C-1 19 4 16 10 16 C16 16 21 19 21 27 Z"/>
  </g>
  <text x="641" y="92" font-size="11" font-weight="700" letter-spacing="0.8" fill="#7d4e00">ZIELKONTO</text>
  <text x="641" y="120" font-size="17" font-weight="600">Gestartetes Programm</text>
  <text x="641" y="146" font-size="13.5">Identität, Berechtigungen und Profil</text>
  <text x="641" y="164" font-size="13.5">des Zielkontos</text>
  <g fill="#7d4e00">
    <circle cx="646" cy="188" r="2.5"/>
    <circle cx="646" cy="207" r="2.5"/>
    <circle cx="646" cy="226" r="2.5"/>
  </g>
  <text x="657" y="192.5" font-size="13">Standardkonto</text>
  <text x="657" y="211.5" font-size="13">Administratorengruppe, nicht erhöht</text>
  <text x="657" y="230.5" font-size="13">Administratorengruppe, erhöht</text>

  <g stroke="#57606a" stroke-width="2" fill="none">
    <line x1="270" y1="160" x2="323" y2="160" marker-end="url(#arrow)"/>
    <line x1="447.5" y1="252" x2="447.5" y2="366" marker-end="url(#arrow)"/>
    <line x1="772.5" y1="368" x2="772.5" y2="254" marker-end="url(#arrow)"/>
  </g>

  <rect x="462" y="268" width="296" height="28" rx="14" fill="#ffffff" stroke="#afb8c1"/>
  <text x="610" y="286.5" font-size="12.5" text-anchor="middle">Windows-UAC-Bestätigung bleibt interaktiv</text>

  <text x="458" y="345" font-size="12" fill="#57606a">Anfrage</text>
  <text x="762" y="345" font-size="12" fill="#57606a" text-anchor="end">Start unter dem Zielkonto</text>

  <rect x="20" y="368" width="270" height="120" rx="8" fill="#f6f8fa"/>
  <rect x="20" y="368" width="5" height="120" rx="2.5"/>
  <text x="42" y="402" font-size="14" font-weight="600">Der Standardbenutzer wird nicht</text>
  <text x="42" y="422" font-size="14" font-weight="600">zum Administrator.</text>
  <text x="42" y="450" font-size="14">Nur das gestartete Programm</text>
  <text x="42" y="470" font-size="14">läuft unter dem Zielkonto.</text>

  <rect x="325" y="368" width="595" height="120" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <g transform="translate(886 382)">
    <path d="M4 9 V6 a5 5 0 0 1 10 0 V9" fill="none" stroke="#1a7f37" stroke-width="2.2"/>
    <rect x="0" y="9" width="18" height="13" rx="2" fill="#1a7f37"/>
  </g>
  <text x="341" y="392" font-size="11" font-weight="700" letter-spacing="0.8" fill="#116329">PRIVILEGIERTER WINDOWS-DIENST</text>
  <text x="341" y="420" font-size="17" font-weight="600">xucRun-Brokerdienst</text>
  <text x="341" y="447" font-size="13.5">Speichert die Anmeldedaten der Zielkonten und verwendet sie nur mit passender</text>
  <text x="341" y="466" font-size="13.5">xucRun-Freigabe. Startet das Programm unter dem Zielkonto.</text>
</svg>
